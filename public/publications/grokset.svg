<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">@GrokSet publication placeholder</title>
  <desc id="description">A restrained document grid framing the @GrokSet paper title, archive identifier, and date.</desc>
  <defs>
    <style>
      svg {
        --paper-background: var(--publication-preview-background, #111820);
        --paper-surface: var(--publication-preview-surface, #18232e);
        --paper-ink: var(--publication-preview-foreground, #edf5f7);
        --paper-muted: var(--publication-preview-muted, #8da0ad);
        --paper-line: var(--publication-preview-border, #344653);
        --paper-accent: var(--portfolio-accent, #00d8ff);
      }

      .background { fill: var(--paper-background); }
      .surface { fill: var(--paper-surface); stroke: var(--paper-line); }
      .grid-line { fill: none; stroke: var(--paper-line); }
      .accent-fill { fill: var(--paper-accent); }
      .accent-line { stroke: var(--paper-accent); }
      .ink { fill: var(--paper-ink); }
      .muted { fill: var(--paper-muted); }
      .title-text { font-family: ui-serif, Georgia, serif; font-weight: 400; }
      .meta-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; letter-spacing: 0.14em; }
    </style>
    <pattern id="document-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 80 0 L 0 0 0 80" stroke-width="1" opacity="0.24" />
    </pattern>
  </defs>

  <rect class="background" width="1600" height="1000" />
  <rect class="surface" x="80" y="80" width="1440" height="840" stroke-width="2" />
  <rect x="80" y="80" width="1440" height="840" fill="url(#document-grid)" opacity="0.62" />
  <rect class="accent-fill" x="80" y="80" width="12" height="840" />

  <g transform="translate(168 166)">
    <text class="meta-text muted" x="0" y="0" font-size="24">ARXIV:2602.21236 / FEBRUARY 2026</text>
    <line class="accent-line" x1="0" y1="52" x2="520" y2="52" stroke-width="5" />

    <text class="title-text ink" font-size="116" letter-spacing="-2">
      <tspan x="0" y="232">@GrokSet:</tspan>
      <tspan x="0" y="370">Multi-party Human-LLM</tspan>
      <tspan x="0" y="508">Interactions in Social Media.</tspan>
    </text>

    <line class="grid-line" x1="0" y1="660" x2="1248" y2="660" stroke-width="2" />
    <line class="grid-line" x1="0" y1="694" x2="1016" y2="694" stroke-width="2" />
    <line class="grid-line" x1="0" y1="728" x2="704" y2="728" stroke-width="2" />
  </g>
</svg>
